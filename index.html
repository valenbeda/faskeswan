<style>
#popup-content a.wa-link {
    color: #128C7E !important;
    font-weight: bold;
    text-decoration: none !important;
    cursor: pointer;
}

#popup-content a.wa-link:hover {
    color: #075E54 !important;
    text-decoration: underline !important;
}
</style>

<script>
(function () {
    function aktifkanWhatsApp() {
        const popup = document.getElementById("popup-content");
        if (!popup) return;

        function ubahNomor() {
            const baris = popup.querySelectorAll("tr");

            baris.forEach(function (row) {
                const label = row.querySelector("th");
                const cell = row.querySelector("td");

                if (!label || !cell) return;

                const namaKolom = label.textContent
                    .trim()
                    .toLowerCase();

                if (!/no\s*hp|nomor\s*(hp|telepon)|whatsapp|no\s*wa/.test(namaKolom)) {
                    return;
                }

                if (cell.querySelector("a.wa-link")) return;

                const nomorAsli = cell.textContent.trim();

                if (!nomorAsli || nomorAsli === "-") return;

                let nomor = nomorAsli.replace(/\D/g, "");

                if (nomor.startsWith("0")) {
                    nomor = "62" + nomor.substring(1);
                } else if (nomor.startsWith("8")) {
                    nomor = "62" + nomor;
                }

                if (!nomor.startsWith("62") ||
                    nomor.length < 10 ||
                    nomor.length > 15) {
                    return;
                }

                const link = document.createElement("a");
                link.className = "wa-link";
                link.href = "https://wa.me/" + nomor;
                link.target = "_blank";
                link.rel = "noopener noreferrer";
                link.textContent = nomorAsli;
                link.title = "Hubungi melalui WhatsApp";

                cell.replaceChildren(link);
            });
        }

        ubahNomor();

        if (!popup.dataset.waObserver) {
            const observer = new MutationObserver(ubahNomor);

            observer.observe(popup, {
                childList: true,
                subtree: true,
                characterData: true
            });

            popup.dataset.waObserver = "aktif";
        }
    }

    if (document.readyState === "loading") {
        document.addEventListener("DOMContentLoaded", aktifkanWhatsApp);
    } else {
        aktifkanWhatsApp();
    }
})();
</script>
